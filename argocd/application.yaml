apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ai-platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ayeshanajib5-cloud/aws-eks-ai-platform.git
    targetRevision: main
    path: helm/ai-platform

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true